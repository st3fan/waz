<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · WAZ</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">Wat Aten Zij</p>
    <h1>What’s for dinner?</h1>
    <p class="intro">Choose your name to join the family meal plan.</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <fieldset>
        <legend>Sign in as</legend>
        <div class="people">
          {% for user in users %}
            <label class="person"><input type="radio" name="user" value="{{ user }}" required><span>{{ user }}</span></label>
          {% endfor %}
        </div>
      </fieldset>
      <button class="button primary wide" type="submit">Open meal planner</button>
    </form>
    <p class="footnote">Local prototype · names are for collaboration, not security</p>
  </main>
</body>
</html>
